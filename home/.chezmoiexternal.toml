    url = "https://github.com/tmux-plugins/tmux-continuum.git"
    refreshPeriod = "168h"
[".tmux/plugins/tmux-copycat"]
    type = "git-repo"
    url = "https://github.com/tmux-plugins/tmux-copycat.git"
    refreshPeriod = "168h"
[".tmux/plugins/tmux-yank"]
