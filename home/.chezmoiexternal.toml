    refreshPeriod = "168h"
[".tmux/plugins/tmux-logging"]
    type = "git-repo"
    url = "https://github.com/tmux-plugins/tmux-logging.git"
    refreshPeriod = "168h"
[".tmux/plugins/tmux"]
    type = "git-repo"
    url = "https://github.com/catppuccin/tmux.git"
    refreshPeriod = "168h"
[".tmux/plugins/tmux-fpp"]
